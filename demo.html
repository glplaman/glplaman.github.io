<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url(/css/fonts_Avenir.css);

    :root {
      --w: 50%;
      --margin: -133px
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background:
        linear-gradient(#0006, #0000 30% 70%, #0004) 50% 0% / 100% 60%,
        linear-gradient(hsl(0deg 50% 50%) 0 0) 50% 0% / 5vw 60%,
        linear-gradient(hsl(30deg 50% 50%) 0 0) 50% 0% / 15vw 60%,
        linear-gradient(hsl(60deg 50% 50%) 0 0) 50% 0% / 25vw 60%,
        linear-gradient(hsl(90deg 50% 50%) 0 0) 50% 0% / 35vw 60%,
        linear-gradient(hsl(120deg 50% 50%) 0 0) 50% 0% / 45vw 60%,
        linear-gradient(hsl(150deg 50% 50%) 0 0) 50% 0% / 55vw 60%,
        linear-gradient(hsl(180deg 50% 50%) 0 0) 50% 0% / 65vw 60%,
        linear-gradient(hsl(210deg 50% 50%) 0 0) 50% 0% / 75vw 60%,
        linear-gradient(hsl(240deg 50% 50%) 0 0) 50% 0% / 85vw 60%,
        linear-gradient(hsl(270deg 50% 50%) 0 0) 50% 0% / 95vw 60%,
        linear-gradient(hsl(300deg 50% 50%) 0 0) 50% 0% / 105vw 60%,
        radial-gradient(100vw 50vw, #0004, #0000),
        conic-gradient(from 170.5deg at 50% calc(60% - 14.8vw), hsl(0deg 50% 50%) 19deg, #0000 0) 0 100% / 100vw 100%,
        conic-gradient(from 153deg at 50% calc(60% - 14.8vw), hsl(30deg 50% 50%) 54deg, #0000 0),
        conic-gradient(from 140deg at 50% calc(60% - 14.8vw), hsl(60deg 50% 50%) 80deg, #0000 0),
        conic-gradient(from 130deg at 50% calc(60% - 14.8vw), hsl(90deg 50% 50%) 100deg, #0000 0),
        conic-gradient(from 123deg at 50% calc(60% - 14.8vw), hsl(120deg 50% 50%) 114deg, #0000 0),
        conic-gradient(from 118.5deg at 50% calc(60% - 14.8vw), hsl(150deg 50% 50%) 123deg, #0000 0),
        conic-gradient(from 114.5deg at 50% calc(60% - 14.8vw), hsl(180deg 50% 50%) 131deg, #0000 0),
        conic-gradient(from 111.5deg at 50% calc(60% - 14.8vw), hsl(210deg 50% 50%) 137deg, #0000 0),
        conic-gradient(from 109.2deg at 50% calc(60% - 14.8vw), hsl(240deg 50% 50%) 141.6deg, #0000 0),
        conic-gradient(from 107.3deg at 50% calc(60% - 14.8vw), hsl(270deg 50% 50%) 145.3deg, #0000 0),
        hsl(300deg 50% 50%);
      background-repeat: no-repeat;
    }
  </style>
</head>

<body>

</body>

</html>
