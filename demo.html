<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url(/css/fonts_Avenir.css);

    :root {
      --bg-color: #fff;
      --txt-color: #000;
      --main-color: #c0392b;
      --second-color: #e74c3c;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div id="app">
    <div @click="age++">{{ age }}</div>
  </div>

  <script type="module">
    import { createApp, ref } from '/utils/lib/vue.esm-browser.js'
    const app = createApp({
      setup() {

        // data
        let age = ref(18)
        // function
        return {
          age
        }
      }
    })
    app.mount('#app')
  </script>
</body>

</html>
