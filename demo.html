<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url(/css/fonts_Avenir.css);

    :root {
      --w: 50%;
      --margin: -133px
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    form {
      max-width: 360px;
      background-color: #fff;
      padding: 45px;
    }

    input,
    button {
      border: none;
      outline: none;
      background-color: transparent;
      width: 100%;
      padding: 15px;
      font-size: 14px;
    }

    input {
      background-color: #f2f2f2;
      margin-bottom: 15px;
    }

    button {
      background-color: #4CAF50;
      text-transform: uppercase;
      color: #fff;
    }
  </style>
</head>

<body>
  <form action="">
    <input type="text" name="uname" id="" placeholder="your name">
    <input type="password" name="upass" id="" placeholder="your password">
    <button>click</button>
  </form>
</body>

</html>
