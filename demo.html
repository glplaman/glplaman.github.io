<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }

    h1 {
      font-size: 2rem;
      pointer-events: none;
      user-select: none;
    }

    h1.active {
      cursor: pointer;
      pointer-events: all;
    }

    h1 span {
      color: #f40;
      animation: flash 1s ease-in-out both;
    }

    @keyframes flash {
      from {
        opacity: 0;
        transform: scale(0);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <h1>glplaman.github.io</h1>
  <script>
    const h = document.querySelector('h1')
    h.innerHTML = h.textContent.replace(/\S/g, `<span>$&</span>`)
    const spans = h.querySelectorAll('span')
    console.log(spans);

    spans.forEach((span, ind) => {
      span.style.animationDelay = `${ind * 0.2}s`
    })
    spans[spans.length - 1].addEventListener('animationend', () => {
      h.classList.add('active')
    })
    h.addEventListener('click', () => {
      window.location.href = '/course/online_zk.html'
    })
  </script>
</body>

</html>
