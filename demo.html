<!DOCTYPE html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url(/css/fonts_Avenir.css);

    :root {
      --bg-color: #fff;
      --txt-color: #000;
      --main-color: #c0392b;
      --second-color: #e74c3c;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    a {
      text-decoration: none;
      color: #000;
      padding: 10px 20px;
    }

    ul {
      list-style: none;
    }

    .nav {
      display: flex;
    }

    .nav li {
      list-style: none;
    }

    .nav-item {
      position: relative;
      padding: 0 10px;
      cursor: pointer;
    }

    .nav-item:focus-within,
    .nav-item:hover {
      background-color: var(--second-color);
    }

    .sub-nav {
      display: none;
    }

    .nav-item:hover .sub-nav {
      display: block;
      position: absolute;
      left: 0;
    }

    .nav-item>.sub-nav-item {
      color: #fff;
    }

    .nav-item:hover>.sub-nav-item {
      background-color: var(--second-color);
      color: #fff;
    }

    .sub-nav-item {
      display: block;
      padding: 0 10px;
    }

    .sub-nav-item:hover {
      color: #f40;
    }

    body {
      display: grid;
      grid-template-columns: 160px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header header"
        "aside main"
        "aside footer";
      min-height: 100vh;
    }

    header {
      grid-area: header;
      position: sticky;
      top: 0;
      z-index: 9;
      background-color: #f40;
      height: 40px;
    }

    aside {
      grid-area: aside;
      background-color: #089;
    }

    .aside {
      position: sticky;
      top: 40px;
    }

    main {
      grid-area: main;
    }

    footer {
      grid-area: footer;
    }

    main p {
      height: 50vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
      background-color: var(--main-color);
      line-height: 40px;
      color: #fff;
    }
  </style>
</head>
