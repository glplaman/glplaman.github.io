<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>详情页 Details</title>
  <link rel="stylesheet" href="../css/exp2024.css">
</head>

<body>
  <header>
  </header>
  <div class="w">
    <h1>详情页</h1>
    <h4>Details</h4>
    <dl>
      <dt>简介 Overview</dt>
      <dd>
        <ul>
          <li>普通页面</li>
          <li>商品数据从全局商品数据 products 获取；需要在首页刷新以便保持数据的一致性</li>
          <li>商品的收藏本地缓存，由用户管理</li>
        </ul>
      </dd>
      <dt>业务 Business </dt>
      <dd>
        <ul>
          <li>加载商品：根据商品记录 _id 从全局商品数据 products 获取</li>
          <li>查看商品大图</li>
          <li>商品的收藏与取消</li>
          <li>添加到购物车；允许调整数量；最少为1</li>
          <li>立即购买；可以和添加到购物车共享受结构</li>
          <li>商品分享</li>
          <li>导航：客服、首页标签页、购物车标签页</li>
        </ul>
      </dd>
      <figure>
        <img src="./imgs/pro-details.png" alt="">
        <figcaption>详情页</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>

</html>
