<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车 Carts</title>
  <link rel="stylesheet" href="../css/exp2024.css">
</head>

<body>
  <header>
  </header>
  <div class="w">
    <h1>购物车</h1>
    <h4>Carts</h4>
    <dl>
      <dt>简介 Overview</dt>
      <dd>
        <ul>
          <li>标签页面</li>
          <li>购物车数据 carts 本地缓存，由用户管理，简化管理端复杂度；但是不便于引流</li>
        </ul>
      </dd>
      <dt>业务 Business </dt>
      <dd>
        <ul>
          <li>加载全局购物车数据并渲染</li>
          <li>数据加载指示</li>
          <li>购物车为空时</li>
          <li>商品全选</li>
          <li>商品部分选择</li>
          <li>商品数量调整；不设库存；数量为0时，从购物车删除</li>
          <li>统计：针对选择商品的总价统计、总数量统计</li>
          <li>导航：到结算页面</li>
        </ul>
      </dd>
      <figure>
        <img src="./imgs/pro-carts.png" alt="">
        <figcaption>购物车</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
