<head>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    @import url(//at.alicdn.com/t/c/font_3834292_bzwva2beroa.css);
    @import url(/css/fonts_GreatVibes.css);

    :root {
      --main-color: rgba(255, 255, 255, 0.2);
      --active-color: #ffde00;
      --side-w: 90px;
      --p-m-g: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: linear-gradient(#eb2c58, #de2812);
      /* perspective: 800px; */
      overflow: hidden;
    }

    h1 {
      position: fixed;
      left: 50%;
      top: 10vh;
      width: max-content;
      transform: translateX(-50%);
      font-family: 'GreatVibes';
      color: var(--active-color);
      user-select: none;
      text-transform: capitalize;
    }

    .container {
      --offset-w: calc(var(--side-w)/2);
      position: relative;
      width: var(--side-w);
      height: var(--side-w);
      border-radius: var(--p-m-g);
      background-color: var(--main-color);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transform-style: preserve-3d;
      /* animation: roll 10s linear infinite; */
    }

    /* .container:hover {
      --offset-w: 120px;
    } */

    /* @keyframes roll {
      to {
        transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
      }
    } */

    .item {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translate(calc(var(--x)*20px), calc(var(--y)*20px));
      transition: .4s calc(var(--delay)*0.06s);
      pointer-events: none;
    }

    .item span {
      opacity: 0;
      transform: scale(0);
      transition: .2s;
      font-size: 32px;
    }

    .container.active .item {
      width: 60px;
      height: 60px;
      transform: translate(calc(var(--x)*90px), calc(var(--y)*90px));
      pointer-events: all;
      background-color: var(--main-color);
    }

    .container.active .item span {
      opacity: 1;
      transform: scale(1);
      color: #fff;
    }

    .container.active .item:hover span {
      color: var(--active-color);
      filter: drop-shadow(0 0 4px var(--main-color));
      transform: scale(1.4);
    }

    /* .side {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.2);
      border: 1px solid #fff;
      transition: 0.4s;
    }

    .side:nth-child(1) {
      transform: translateZ(var(--offset-w));
    }

    .side:nth-child(2) {
      transform: rotateY(180deg) translateZ(var(--offset-w));
    }

    .side:nth-child(3) {
      transform: rotateY(90deg) translateZ(var(--offset-w));
    }

    .side:nth-child(4) {
      transform: rotateY(-90deg) translateZ(var(--offset-w));
    }

    .side:nth-child(5) {
      transform: rotateX(90deg) translateZ(var(--offset-w));
    }

    .side:nth-child(6) {
      transform: rotateX(-90deg) translateZ(var(--offset-w));
    } */

    /* snow */
    .star {
      position: fixed;
      bottom: 0;
      width: 10px;
      aspect-ratio: 1/1;
      border-radius: 50%;
      background-color: #fff;
      box-shadow: 0 0 10px #fff,
        0 0 20px #fff,
        0 0 30px #fff,
        0 0 40px #fff;
      animation: fall 12s linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100vh);
        opacity: 1;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: translateY(0px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- <div class="side"></div>
    <div class="side"></div>
    <div class="side"></div>
    <div class="side"></div>
    <div class="side"></div>
    <div class="side"></div> -->
    <a class="item" style="--delay:0;--x:-1;--y:-1" href="./web/index.html">
      <span class="iconfont icon-HTML-5"></span>
    </a>
    <a class="item" style="--delay:1;--x:0;--y:-1" href="./vue/index.html">

    <a class="item" style="--delay:2;--x:1;--y:-1" href="./minip/index.html">

    <a class="item" style="--delay:3;--x:-1;--y:0" href="./network/index.html">

    <a class="item" style="--delay:2;--x:0;--y:0" href="./node/index.html">

    </a>
    <a class="item" style="--delay:3;--x:1;--y:0" href="./unity/index.html">

    </a>
    <a class="item" style="--delay:2;--x:-1;--y:1" href="./dataStruct/index.html">

    </a>
    <a class="item" style="--delay:1;--x:0;--y:1" href="./python/index.html">

    <a class="item" style="--delay:3;--x:1;--y:1" href="./wsn/index.html">
      <span class="iconfont icon-ic"></span>
    </a>
  </div>
  <h1>happy new year 2026</h1>
  <script>
    const container = document.querySelector('.container')
    container.addEventListener('click', (e) => {
      if (container == e.target) {
        container.classList.toggle('active')
      }
    })
    document.body.addEventListener('click', (e) => {
      if (document.body == e.target)
        container.classList.remove('active')
    })
    const items = container.querySelectorAll('.item')
    items.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault()
        container.classList.remove('active')
        container.addEventListener('transitionend', () => {
          window.location.href = item.href
        }, { once: true })
      })
    })
    // snowing
    const stars = document.body
    function gerStars() {
      let dur = 6 + Math.random() * 4
      let span = document.createElement('div')
      span.className = 'star'
      span.style.width = Math.random() * 10 + 'px'
      span.style.left = Math.random() * window.innerWidth + 'px'
      span.style.animationDuration = dur + 's'
      stars.appendChild(span)
      span.addEventListener('animationend', () => {
        span.remove()
      })
      // setTimeout(() => {
      //   span.remove()
      // }, (dur + 0.1) * 1000)
    }
    setInterval(gerStars, 400);
  </script>
</body>
