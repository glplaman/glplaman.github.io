<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/reset.css">
  <title>Nginx</title>
</head>

<body>
  <div class="w">
    <header>
      <h1>Nginx</h1>
      <span>2026-06-20</span>
    </header>
    <dl>
      <dt>Install</dt>
      <ol>
        <li>更新</li>
        <pre>sudo apt update</pre>
        <li>安装</li>
        <pre>sudo apt install nginx -y</pre>
        <li>查看状态</li>
        <pre>systemctrl status nginx</pre>
      </ol>
    </dl>
    <h2>Workflow</h2>
    <dl>
      <dt>Front-end</dt>
      <dd>Node.js</dd>
      <dd>Git</dd>
      <dd>Github</dd>
      <dd>Vs Code</dd>
      <dt>Back-end</dt>
      <dd>Server/Ubuntu</dd>
      <dd>Node.js</dd>
      <dd>Git</dd>
      <dd>Nginx</dd>
      <dt>基本流程</dt>
      <ol>
        <li>Client 端开发并 PUSH 到 Github</li>
        <li>Server 端 PULL 更新</li>
      </ol>
    </dl>
  </div>
  <div id="footer"></div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
