<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态图 State Diagram</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>状态图</h1>
      <span>State Diagram</span>
    </header>
    <dl>
      <dt>概述</dt>
      <dd>用来描述一个特定对象的所有可能状态，以及由于各种事件的发生而引起的状态之间的转移或变化</dd>
      <dd>描述行为的结果</dd>
      <dd>状态转换图；属于行为模型</dd>
      <dd>描绘系统的状态以及引起系统状态转换的事件来表示系统的行为</dd>
      <dd>状态机；动态图</dd>
      <dd>组成：状态、转换、事件、活动；强调对象行为的时间顺序</dd>
      <dd>状态变迁|触发的条件</dd>
      <dt>图例</dt>
      <dd>初态：实心圆；只能有1个</dd>
      <dd>终态：同心圆，内为实心圆；可以有多个</dd>
      <dd>状态：圆角矩形；可以包括状态的名称、状态变量、状态表</dd>
      <dd>方向箭头：转换</dd>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
