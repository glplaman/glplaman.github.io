<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒图 N-S</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>盒图</h1>
      <span>N-S</span>
    </header>
    <dl>
      <dd>盒图是由 Nassi 和 Shneiderman 提出，又称 N-S 图</dd>
      <dd>指定了5个图形组件来表示五个基本控制结构</dd>
      <dd>没有箭头，不允许随意转移，只允许程序员用结构化设计方法来思考问题、解决问题</dd>
      <dt>常见结构 Statement</dt>
      <div>1. 顺序结构</div>
      <dd>依次执行 A、B</dd>
      <figure>
        <img src="./imgs/ns0.png" alt="">
        <figcaption>顺序结构</figcaption>
      </figure>
      <div>2. 选择结构</div>
      <dd>如果 P 为 T，执行 A</dd>
      <dd>否则退出</dd>
      <figure>
        <img src="./imgs/ns2.png" alt="">
        <figcaption>IF-THEN</figcaption>
      </figure>
      <dd>如果 P 为 T，执行 A</dd>
      <dd>否则执行 B</dd>
      <figure>
        <img src="./imgs/ns1.png" alt="">
        <figcaption>IF-ELSE-THEN</figcaption>
      </figure>
      <dd>如果 P 为 1，执行 A1</dd>
      <dd>如果 P 为 2，执行 A2</dd>
      <dd>依次类推</dd>
      <figure>
        <img src="./imgs/ns3.png" alt="">
        <figcaption>SWITCH-CASE</figcaption>
      </figure>
      <div>3. 循环结构</div>
      <dd>S 表示 Statement，循环体</dd>
      <figure>
        <img src="./imgs/ns4.png" alt="">
        <figcaption>WHILE-DO</figcaption>
      </figure>
      <figure>
        <img src="./imgs/ns5.png" alt="">
        <figcaption>DO-UNTIL</figcaption>
      </figure>
      <div class="demo">将右图含有Goto语句的程序流程图改为 N-S 图</div>
      <figure>
        <img src="./imgs/ns6.png" alt="">
        <figcaption>含有Goto语句的程序流程图</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
