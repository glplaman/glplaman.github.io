<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>层次图 Hierarchy Chart</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>层次图</h1>
      <span>Hierarchy Chart</span>
    </header>
    <dl>
      <div class="tips">
        <p>H 图：聚焦系统；强调层级划分</p>
      </div>
      <dd>层次图 Hierarchy Chart</dd>
      <dd>也叫层级图、<a href="https://gitmind.com/hierarchy-chart.html">H 图</a></dd>
      <dd>核心目的是展示层级结构 Hierarchy，而不是流程，所不需要箭头指示</dd>
      <dd>整个结构由模块和调用关系组成
        <p>模块：使用矩形表示</p>
        <p>调用关系：模块之间的连线使用无向线；使用上下位置来体现，而不是靠“箭头”</p>
      </dd>
      <dd>不体现模块的调用关系和数据流、控制流，而由 IPO 体现</dd>
      <dd>支持模块<strong>编号</strong>，增强可追踪性，但不体现调用顺序</dd>
      <div class="tips">
        <p>知道：谁调用谁</p>
        <p>不知道：传了什么数据；内部干了什么</p>
      </div>
      <figure>
        <img src="./imgs/dt5.png" alt="">
        <figcaption>公司人员组织H 图</figcaption>
      </figure>
      <div class="demo">使用 PPT 绘制层次图</div>
      <figure>
        <img src="./imgs/dt0.png" alt="">
        <figcaption>H 图</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
