<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态路由 useParams</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>动态路由</h1>
      <span>&commat;useParams</span>
    </header>
    <dl>
      <dt>Overview</dt>
      <dd>动态路由使用 / 定义</dd>
      <dd>路由设计</dd>
      <pre><code>&lt;Route path="/test/:id" element={&lt;Test />} /></code></pre>
      <dd>路由使用</dd>
      <pre><code>&lt;NavLink to='test/1010'>test&lt;/NavLink></code></pre>
      <dd>使用 useParams 解析/获取动态路由 / 参数</dd>
      <dd>需引入再使用</dd>
      <pre>import { useParams } from "react-router"</pre>
      <pre>let { id } = useParams()</pre>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
