<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404路由 NotFound</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>404路由</h1>
      <span>&commat;NotFound</span>
    </header>
    <dl>
      <dd>在路由设计最后面，增加一条路由来匹配任意路由</dd>
      <dd>可以定制 404 组件</dd>
      <dd>也可以简单返回提示信息</dd>
      <pre>&lt;Route path="*" element={&lt;h1&gt;Not Found&lt;/h1&gt;}&gt;&lt;/Route&gt;</pre>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
