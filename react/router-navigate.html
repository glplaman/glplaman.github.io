<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编程式路由 useNavigate</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>编程式路由</h1>
      <span>&commat;useNavigate</span>
    </header>
    <dl>
      <dt>Overview</dt>
      <dd>使用 useNavigate 实现 <strong>编程式</strong> 导航</dd>
      <dd>需引入再使用</dd>
      <pre>import { useNavigate } from "react-router"</pre>
      <dd>实例化</dd>
      <pre>const nav = useNavigate()</pre>
      <pre>&lt;button onClick={() =&gt; nav('/center')}&gt;to Center&lt;/button&gt;</pre>
      <dd>也可以使用对象的方式</dd>
      <pre><code>&lt;button onClick={() => nav({
  pathname: '/center'
})}>Home&lt;/button></code></pre>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
