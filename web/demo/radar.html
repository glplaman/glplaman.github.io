<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar scanning</title>
  <style>
    :root {
      --main-color: #0f0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000;
    }

    .radar {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      overflow: hidden;
      background-image: url(/utils/logo/earth.png);
      background-size: cover;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8) inset;
    }

    .radar::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50%;
      height: 50%;
      background-image: linear-gradient(45deg, var(--main-color), transparent 50%);
      animation: scan 5s linear infinite;
      transform-origin: left top;
    }

    @keyframes scan {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="radar"></div>
</body>

</html>
