<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历 Resume</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="./css/resume-cube.css">
</head>

<body>
  <div class="wrap">
    <div class="sides">
      <div class="side home">home</div>
      <div class="side work">work</div>
      <div class="side team">team</div>
      <div class="side contact">contact</div>
    </div>
  </div>
  <ul class="pages">
    <li class="active"><i class='bx bxs-home'></i><span>Home</span></li>
    <li><i class='bx bxs-notepad'></i><span>Work</span></li>
    <li><i class='bx bxs-shopping-bag'></i><span>Team</span></li>
    <li><i class='bx bxs-envelope'></i><span>Contact</span></li>
  </ul>
  <script>
    const sides = document.querySelector('.sides');
    sides.addEventListener('animationend', () => {
      const lis = document.querySelectorAll('.pages li');
      lis.forEach((li, ind) => {
        li.addEventListener('click', function () {
          sides.style.transform = `rotateY(${ind * -90}deg)`;
          lis.forEach(li => {
            li.classList.remove('active');
          })
          li.classList.add('active');
        })
      })
    })
  </script>
</body>

</html>
