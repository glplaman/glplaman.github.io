<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主题切换 Theme</title>
  <style>
    :root {
      --bg-color: #fff;
      --txt-color: #000;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--txt-color);
    }

    body:has(option[value="dark"]:checked) {
      --bg-color: #000;
      --txt-color: #fff;
    }

    select {
      background-color: var(--txt-color);
      color: var(--bg-color);
    }
  </style>
</head>

<body>
  <select>
    <option value="light">light</option>
    <option value="dark">dark</option>
  </select>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam voluptatibus inventore quos veniam, aspernatur
    quas corporis excepturi quaerat et fugiat est totam amet laudantium officia voluptates nemo fugit, dicta eum.</p>
  <script>
  </script>
</body>

</html>
