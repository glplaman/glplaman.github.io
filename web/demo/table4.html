<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滚动表格 Table</title>
  <link rel="stylesheet" href="//at.alicdn.com/t/c/font_3859342_6edyvdmtfj.css">
  <style>
    /* init start */
    :root {
      --main-color: #1abc9c;
      --second-color: #035c4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Alibaba PuHuiTi", "Source Han Serif", "Source Han Sans", "PingFang SC", "Microsoft YaHei", "微软雅黑", Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      min-height: 100vh;
    }

    .wrap {
      width: 96%;
      max-width: 800px;
      scrollbar-width: thin;
      scroll-behavior: smooth;
      scrollbar-color: var(--main-color) #eee;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      line-height: 2;
      text-align: center;
    }

    thead tr {
      background-color: var(--main-color);
      color: #f1f2f3;
    }

    .scroll table {
      width: 100%;
      text-align: left;
      margin: 0;
    }

    .scroll .scroll-body {
      max-height: 160px;
      overflow: auto;
    }

    table tbody td:first-child,
    .ellipsis {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="scroll">
      <div class="scroll-head">
        <table>
          <caption>表6 滚动表格</caption>
          <thead>
            <tr>
              <th>Type</th>
              <th>Quos</th>
              <th>Dolore</th>
            </tr>
          </thead>
        </table>
      </div>
      <div class="scroll-body">
        <table class="zebra">

            <tr>
              <td>A</td>

            </tr>

            </tr>
            <tr>
              <td>C</td>

            </tr>
            <tr>
              <td>D</td>
              <td>Veniam</td>
              <td>Voluptate?</td>
            </tr>
            <tr>
              <td>E</td>
              <td>Dolorem!</td>

            </tr>
            <tr>
              <td>F</td>

            </tr>
            <tr>

          </tbody>
        </table>
      </div>

</body>

</html>
