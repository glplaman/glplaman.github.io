<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="./css/contact.css">
</head>

<body>
  <form id="form">
    <h2>message here <span class="iconfont icon-qianming"></span></h2>
    <div class="input-box">
      <input class="ipt" type="text" name="name" required minlength="8" placeholder="your nickname">
      <span class="label iconfont icon-User"></span>
    </div>
    <div class="input-box">
      <input class="ipt" type="email" name="email" required placeholder="your email">
      <span class="label iconfont icon-xinfeng"></span>
    </div>
    <div class="input-box message">
      <textarea class="ipt" name="message" required maxlength="60" placeholder="your message"></textarea>
      <span class="label iconfont icon-bianjiwenben"></span>
    </div>
    <button type="submit" id="btn">submit</button>
    <button type="reset">reset</button>
  </form>
  <!-- <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script> -->
  <script src="/utils/lib/email.min.js"></script>
  <script src="./js/contact.js"></script>
</body>

</html>
