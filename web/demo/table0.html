<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线框表格 Table</title>
  <link rel="stylesheet" href="//at.alicdn.com/t/c/font_3859342_6edyvdmtfj.css">
  <style>
    /* init start */
    :root {
      --main-color: #1abc9c;
      --second-color: #035c4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Alibaba PuHuiTi", "Source Han Serif", "Source Han Sans", "PingFang SC", "Microsoft YaHei", "微软雅黑", Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      min-height: 100vh;
    }

    .wrap {
      width: 96%;
      max-width: 800px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      line-height: 2;
      text-align: center;
    }

    .line {
      border: 2px solid var(--main-color);
    }

    .line td,
    .line th {
      border: 1px dotted var(--main-color);
    }

    table tbody td:first-child,
    .ellipsis {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <table>
      <caption>表1 线框表格</caption>
      <thead>
        <tr>
          <th>Type</th>
          <th>Quos</th>
          <th>Dolore</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>A</td>
          <td>Corrupti!</td>
          <td>Cumque!</td>
        </tr>
        <tr>
          <td>B</td>
          <td>Porro!</td>
          <td>Qui!</td>
        </tr>
        <tr>
          <td>C</td>
          <td>Doloremque!</td>
          <td>Odit</td>
        </tr>
        <tr>
          <td>D</td>
          <td>Veniam</td>
          <td>Voluptate?</td>
        </tr>
        <tr>
          <td>E</td>
          <td>Dolorem!</td>
          <td>Eligendi</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>

</html>
