<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown</title>
  <style>
    :root {
      --main-color: #c0392b;
      --second-color: #e74c3c;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    a {
      text-decoration: none;
      color: #000;
    }

    nav {
      width: min(1024px, 90%);
      background-color: var(--main-color);
      line-height: 40px;
      margin: 4rem auto;
    }

    .nav {
      display: flex;
    }

    .nav li {
      list-style: none;
    }

    .nav-item {
      position: relative;
      padding: 0 30px;
      cursor: pointer;
      color: #fff;
    }

    .nav-item:focus-within,
    .nav-item:hover {
      background-color: var(--second-color);
    }

    .sub-nav {
      display: none;
    }

    .nav-item:hover .sub-nav {
      display: block;
      position: absolute;
      left: 0;
    }

    .nav-item>.sub-nav-item {
      color: #fff;
    }

    .nav-item:hover>.sub-nav-item {
      background-color: var(--second-color);
      color: #fff;
    }

    .sub-nav-item {
      display: block;
      padding: 0 30px;
    }

    .sub-nav-item:hover {
      color: var(--main-color);
      background-color: #f402;
    }
  </style>
</head>

<body>
  <nav>
    <ul class="nav">
      <li class="nav-item">
        <div>Lorem</div>
        <div class="sub-nav">
          <a class="sub-nav-item" href="">Lorem</a>
          <a class="sub-nav-item" href="">Pariatur</a>
          <a class="sub-nav-item" href="">Quasi</a>
        </div>
      </li>
      <li class="nav-item">
        <div>Praesentium</div>
        <div class="sub-nav">
          <a class="sub-nav-item" href="">Lorem</a>
          <a class="sub-nav-item" href="">Consequuntur</a>
          <a class="sub-nav-item" href="">Eum</a>
          <a class="sub-nav-item" href="">Exercitationem</a>
        </div>
      </li>
      <li class="nav-item">
        <a class="sub-nav-item" href="">Lorem</a>
      </li>
      <li class="nav-item">
        <div>Dolor</div>
        <div class="sub-nav">
          <a class="sub-nav-item" href="">Lorem</a>
          <a class="sub-nav-item" href="">Pariatur</a>
          <a class="sub-nav-item" href="">Quasi</a>
        </div>
      </li>
      <li class="nav-item">
        <div>Fugiat</div>
        <div class="sub-nav">
          <a class="sub-nav-item" href="">Lorem</a>
          <a class="sub-nav-item" href="">Consequuntur</a>
        </div>
      </li>
    </ul>
  </nav>
</body>

</html>
