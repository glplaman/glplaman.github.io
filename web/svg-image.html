<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像 Image</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/page.css">
  <base target="_blank">
  <style>
    .svg {
      width: 300px;
      height: 300px;
      background-color: #f1f2f0;
    }
  </style>
</head>

<body>
  <div class="w">
    <header>
      <h1>图像</h1>
      <span>&commat;Image</span>
    </header>
    <dl>
      <figure>
        <svg class="svg">
          <image x="100" y="100" width="100" href="/imgs/avatar.png"></image>
        </svg>
        <figcaption>Avatar</figcaption>
      </figure>
      <figure>
        <svg class="svg">
          <defs>
            <pattern id="imgPattern" patternUnits="userSpaceOnUse" width="50" height="50">
              <image href="/imgs/avatar.png" x="0" y="0" width="50" height="50"></image>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#imgPattern)" />
        </svg>
        <figcaption>Avatar</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
