<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主机路由 Host Route</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <section class="w">
    <header>
      <h1>主机路由</h1>
      <span>&commat;Host Route</span>
    </header>
    <img src="./imgs/host.png" alt="">
    <dl>
      <dd>指向特定主机的路由；精确路由</dd>
      <dd>子网掩码为 /32</dd>
      <dd>优先级较高</dd>
      <dd>在网络设计、故障排除和精细化流量控制中扮演着重要角色</dd>
      <dd>下图中的L路由就是主机路由，是发给路由器的数据，不需要转发</dd>
      <figure>
        <img src="./imgs/r8.png" alt="">
        <figcaption>主机路由</figcaption>
      </figure>
      <div>[<span class="iconfont icon-keyboard"></span>] 隔离问题主机</div>
      <dd>为问题主机配置主机路由，将其下一条指向空</dd>
      <pre>Router(config)# ip route 192.168.1.100 255.255.255.255 null</pre>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </section>
</body>

</html>
