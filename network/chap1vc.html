<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚电路 Virtual Circuit</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>虚电路</h1>
      <span>&commat;Virtual Circuit</span>
    </header>
    <dl>
      <dt>概述 Overview</dt>
      <dd>虚电路是一种面向连接的分组交换技术</dd>
      <dd>在数据传输前，先在源和目的之间建立一条逻辑连接（“虚”的，非物理专线），之后所有分组沿此路径传输</dd>
      <dt>阶段</dt>
      <ol>
        <li>建立连接</li>
        <li>数据传输</li>
        <li>拆除连接</li>
      </ol>
      <dd>所有分组按序到达，无需每个分组携带完整地址（只需VC标识符，如VCI/VPI）</dd>
      <dd>网络节点需维护连接状态（与无连接的数据报不同）</dd>
      <dt>典型协议</dt>
      <ul>
        <li>X.25</li>
        <li>帧中继 Frame Relay</li>
        <li>异步传输模式 ATM</li>
      </ul>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
