<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验 局域网 LAN</title>
  <link rel="stylesheet" href="../css/drill.css">
  <base target="_blank">
</head>

<body>
  <header></header>
  <div class="w">
    <h1>局域网</h1>
    <h4>LAN</h4>
    <dl class="container">
      <dt>实验内容</dt>
      <dd>局域网 LAN</dd>
      <dt>实验目的</dt>
      <dd>掌握局域网 LAN 的规划和配置</dd>
      <dt>使用步骤</dt>
      <ol>
        <li>搭建拓扑
          <p>诺干台 PC</p>
          <p>2台 2960 交换机</p>
        </li>
        <figure>
          <img src="./imgs/lan1.png" alt="">
          <figcaption>局域网拓扑</figcaption>
        </figure>
        <li>根据拓扑配置各主机IP</li>
        <li>利用 Ping 测试各主机之间的连通性</li>
        <li>PC0 发送广播：单击"添加复杂 PDU <span class="iconfont icon-email1"></span>" → 再单击"PC0"作为广播方 → 定制广播报文 → 创建 PDU</li>
        <figure>
          <img src="./imgs/vlan13.png" alt="网络拓扑">
          <figcaption>复杂 PDU</figcaption>
        </figure>
        <li>查看广播分组的转发过程</li>
        <li>思考同一个广播域下面临的问题</li>
      </ol>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
