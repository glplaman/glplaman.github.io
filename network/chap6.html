<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用层 Application Layer</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="/css/diagram.css">
  <base target="_blank">
  <style>
    header {
      background-image: url(https://networkencyclopedia.com/wp-content/uploads/2019/10/MAPI-Mastering-the-Messaging-Application-Programming-Interface.webp);
    }
  </style>
</head>

<body>
  <div class="w">
    <header>
      <h1>应用层</h1>
      <span>&commat;Application Layer</span>
    </header>
    <dl>
      <figure>
        <div class="diagram-wrap">
          <div class="diagram" style="--ind:4;--bg:#f40;--color:#fff;">
            <div class="f">Application layer</div>
            <div class="r"></div>
            <div class="t"></div>
          </div>
          <div class="diagram" style="--ind:3">
            <div class="f">Transport layer</div>
            <div class="r"></div>
            <div class="t"></div>
          </div>
          <div class="diagram" style="--ind:2; ">
            <div class="f">Network layer</div>
            <div class="r"></div>
            <div class="t"></div>
          </div>
          <div class="diagram" style="--ind:1">
            <div class="f">Data-link layer</div>
            <div class="r"></div>
            <div class="t"></div>
          </div>
          <div class="diagram" style="--ind:0">
            <div class="f">Physical layer</div>
            <div class="r"></div>
            <div class="t"></div>
          </div>
        </div>
        <figcaption>第五层</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
