<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软件项目质量计划 Quality</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>软件项目质量计划</h1>
      <span>Quality</span>
    </header>
    <dl>
      <dt>软件质量模型</dt>
      <dd>Boehm 质量模型</dd>
      <dd>McCall 质量模型</dd>
      <dd>ISO 质量模型及演化版</dd>
      <dt>软件质量管理活动</dt>
      <dd>软件质量保证 Quality assurances</dd>
      <dd>软件质量控制 Quality control</dd>
    </dl>
    <h2>七大质量管理工具</h2>
    <dl>
      <dt>流程图 Flowchart</dt>
      <dt>因果图</dt>
      <dt>直方图 Histogram</dt>
      <div class="demo"><a
          href="https://www.bilibili.com/video/BV1Z75i6qEei/?spm_id_from=333.1387.homepage.video_card.click&vd_source=fe13480e1099e18e9d5f4e25467df4df">Bilibili-直方图
          Histogram</a></div>
      <figure>
        <img src="/office/imgs/chart9.png" alt="">
        <figcaption>语文成绩分布</figcaption>
      </figure>
      <dt>散点图 Scatter</dt>
      <dt>帕累托定律 Pareto Principle</dt>
      <dd>大约 80% 的结果（产出），往往来自于 20% 的原因（投入）。</dd>
      <dt>控制图</dt>
      <dt>核查表</dt>
    </dl>
    <h2>敏捷项目质量管理</h2>
    <dl>
      <dd>质量内建</dd>
      <dd>质量外延</dd>
    </dl>
    <div id="footer" class="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
