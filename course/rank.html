<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apache ECharts</title>
  <base target="_blank">
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: "Alibaba PuHuiTi", "Source Han Serif", "Source Han Sans", "PingFang SC", "Microsoft YaHei", "微软雅黑", Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #fa0 #eee;
    }

    .w {
      width: 96%;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      padding-top: 2rem;
    }

    h1 {
      font-size: 20px;
    }

    select {
      border: none;
      outline: none;
    }

    .chart-box {
      height: 300px;
    }
  </style>
</head>

<body>
  <div class="w">
    <h1>积分榜</h1>
    <select name="select" id="select">
      <option value="202501.json">前端开发框架与应用-23软工-3班</option>
      <option value="202502.json">前端开发框架与应用-23软工-4班</option>
      <option value="202503.json">计算机网络-24计科-2班</option>
      <option value="202504.json">计算机网络-24计科-4班</option>
      <option value="202505.json">计算机网络-24计科-6班</option>
    </select>
    <div id="echarts-rank" class="chart-box"></div>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
  <script src="/utils/lib/echarts.min.js"></script>
  <script>
    const select = document.getElementById('select')
    select.addEventListener('change', (e) => {
      console.log(e.target.value);
      loadDta(e.target.value)
    })
    const rank = document.getElementById('echarts-rank');
    const myChartRank = echarts.init(rank);
    const loadDta = async (url) => {
      const res = await fetch('/utils/data/rank/' + url)
      const json = await res.json()
      const source = json.cont.map(item => {
        return [item.ucredit, item.uname]
      })
      rank.style.height = source.length * 30 + 'px'

      const option = {
        color: ['#f40', '#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4', '#ea7ccc'],
        // title: {
        //   text: '积分榜',
        //   subtext: json.info.course + '-' + json.info.grade + json.info.major + '-' + json.info.class + '班',
        //   left: 'center',
        // },
        dataset: {
          source
        },
        grid: {
          containLabel: true,
          top: 20,
          bottom: 20,
          left: 60,
          right: 10
        },
        xAxis: {
          // name: 'Stars',
          max: Math.ceil(Math.max(...source.map(item => item[0])) * 1.2)
        },
        yAxis: {
          // name: 'Name',
          type: 'category',
          axisLabel: {
            width: 60, // 标签宽度
            fontSize: 14,
            rotate: 0,
            overflow: 'truncate',
            ellipsis: '...',
            interval: 0 // 强制显示所有标签，不省略；每隔 0 个就显示一个 → 全部显示
          }
        },
        series: [
          {
            type: 'bar',
            encode: {
              x: 'Stars',
              y: 'Name'
            },
            barWidth: 20,
            showBackground: true,
            backgroundStyle: { color: '#eee' },
            itemStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: '#f90' },
                { offset: 1, color: '#f40' }
              ]),
            },
            emphasis: {
              itemStyle: {
                color: '#ff4400'
                // color: (params) => `rgba(${255 - params.dataIndex * 10}, 100, 100, 1)`,
              },
              focus: 'series', // 'none' | 'series' | 'self'
              blurScope: 'coordinateSystem' // 模糊其他元素（可选）
            }
          },
        ],
        tooltip: {
          // 触发类型为 item（柱子）
          // trigger: 'item',
          // 鼠标悬停时显示阴影区域
          // axisPointer: {
          //   type: 'shadow'
          // },
          // formatter: (params) => {
          //   console.log(params);
          //   return `${params.value.reverse().join('')} Stars`;
          // }
        },
      };
      myChartRank.setOption(option);
      myChartRank.resize();
    }
    loadDta('202501.json')
  </script>
</body>

</html>
