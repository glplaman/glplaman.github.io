<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histogram</title>
  <link rel="stylesheet" href="/css/reset.css">
  <base target="_blank">
</head>

<body>
  <div class="w">
    <header>
      <h1>直方图</h1>
      <span>Histogram</span>
    </header>
    <dl>
      <dt>概述</dt>
      <dd>数据的分布</dd>
      <dd>样本空间通常比较大，如不少于50个，才具备统计意义</dd>
      <dd>应用
        <p>质量管控：用于监控生产过程是否稳定，数据分布是否符合规格要求</p>
        <p>数据分析：在探索性数据分析中，它是第一步，用于了解数据的整体情况和潜在问题</p>
        <p>绩效评估：分析员工绩效得分、客户满意度等数据的分布</p>
        <p>科学研究：处理实验数据，分析测量结果的分布规律</p>
        <p>金融分析：分析投资回报率、风险等的分布</p>
      </dd>
      <dd>x坐标：箱的宽带、箱的组数、区间、组</dd>
      <dd>y坐标：频点、频数、边界</dd>
      <div class="demo">成绩分布</div>
      <div class="demo">身高分布</div>
      <div class="demo">捐款分布</div>
      <div class="demo">每日利润</div>
    </dl>
  </div>
</body>

</html>
