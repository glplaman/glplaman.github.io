<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合并计算 Consolidate</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
</head>

<body>
  <header></header>
  <div class="w">
    <h1>合并计算</h1>
    <h3>Consolidate</h3>
    <dl>
      <dd>统计全年生成总量</dd>
      <ol>
        <li>准备数据：每月的生成量，按周</li>
        <li>为12张工作表设置同样的样式</li>
        <li>创建新工作表"统计"</li>
        <li>单击"合并计算"，勾选"首行"、"最左列"；单击"浏览"，框选第一张表的数据，并"添加"</li>
        <li>依次单击其它工作表，采用默认框选范围并"添加"；注意：不要点击"统计"表</li>
        <li>所有数据选择完毕后，单击"确定"，在"统计"工作表中给出合并计算后的结果</li>
      </ol>
    </dl>
    <div id="footer"></div>
    <script src="/utils/custom/footer.js"></script>
  </div>
</body>

</html>
