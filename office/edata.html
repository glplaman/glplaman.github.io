<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据 Data</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
  <style>
    figure>div {
      margin: 0 auto;
      height: 96px;
      background-image: url(./imgs/edata.png);
      border-top: 2px solid #217346;
    }

    .img-sort {
      width: 207px;
      background-position: -442px 0px;
    }

    .img-tool {
      width: 289px;
      background-position: -650px 0px;
    }

    .img-show {
      width: 264px;
      background-position: -1051px 0px;
    }
  </style>
</head>

<body>
  <header></header>
  <div class="w">
    <h1>数据</h1>
    <h3>Data</h3>
    <dl>
      <dt>内容 Contents</dt>
      <dd>排序和筛选</dd>
      <figure>
        <div class="img-sort"></div>
        <figcaption>排序和筛选</figcaption>
      </figure>
      <dd>数据工具</dd>
      <figure>
        <div class="img-tool"></div>
        <figcaption>数据工具</figcaption>
      </figure>
      <dd>分级显示 → 分类汇总</dd>
      <figure>
        <div class="img-show"></div>
        <figcaption>分级显示</figcaption>
      </figure>
    </dl>
    <div class="chap">数据工具</div>
    <dl>
      <dt>分列</dt>
      <dd>将单列数据拆分为多列；如将姓名字段拆分为姓和名两列</dd>
      <dt>数据验证</dt>
      <dd>对工作表的编辑进行约定</dd>
      <dt>合并计算</dt>
      <dd>合并计算多个工作表，如求全年生成总量</dd>
      <figure>
        <img src="./imgs/data4.png" alt="">
        <figcaption>数据验证</figcaption>
      </figure>
      <figure>
        <img src="./imgs/data3.png" alt="">
        <figcaption>合并计算</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
