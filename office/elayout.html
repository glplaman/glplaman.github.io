<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局 Layout</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
</head>

<body>
  <header></header>
  <div class="w">
    <h1>布局</h1>
    <h3>Layout</h3>
    <h2>页面设置</h2>
    <dl>
      <dt>页面</dt>
      <figure>
        <img src="./imgs/layout0.png" alt="">
        <figcaption>页面</figcaption>
      </figure>
      <dt>页边距</dt>
      <dd>通常使内容区域水平且垂直居中</dd>
      <figure>
        <img src="./imgs/layout1.png" alt="">
        <figcaption>页边距</figcaption>
      </figure>
      <dt>页眉和页脚</dt>
      <dd>和 Word 不同，Excel 的页眉和页脚设置是在页面设置里</dd>
      <figure>
        <img src="./imgs/layout2.png" alt="">
        <figcaption>页眉和页脚</figcaption>
      </figure>
      <dt>工作表</dt>
      <dd>打印时的相关设置</dd>
      <dd>网格线→打印：打印时，会带上网格线；如果需要具体的边框样式，请使用单元格样式设置</dd>
      <figure>
        <img src="./imgs/layout3.png" alt="">
        <figcaption>工作表</figcaption>
      </figure>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
