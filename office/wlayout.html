<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布局 Layout</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
</head>

<body>
  <header></header>
  <div class="w">
    <h1>布局</h1>
    <h3>Layout</h3>
    <dl>
      <dt>内容 Contents</dt>
      <dd>页面布局</dd>
      <dd>分页符</dd>
      <dd>分节符</dd>
    </dl>
    <div class="chap">页面设置</div>
    <dl>
      <dt>文字方向</dt>
      <dt>页边距</dt>
      <dt>纸张方向</dt>
      <dd>纵向、横向</dd>
      <dd>默认是当前节的页面方向，要实现混合排版，必须将页面放在不同的节中</dd>
      <dt>纸张大小</dt>
      <figure>
        <img src="./imgs/page.png" alt="">
        <figcaption>页面设置</figcaption>
      </figure>
      <dt>栏</dt>
      <dd>"更多栏"对话框，功能更加丰富</dd>
      <figure>
        <img src="./imgs/cols.png" alt="">
        <figcaption>文档属性</figcaption>
      </figure>
      <dt>分隔符</dt>
      <dd>分页符：在同一节内，单纯的新起一页。再不要不断回车换行撑满到下一页了</dd>
      <dd>分节符：默认都是在一节内操作，也可以插入分节符，开始新的一节；每个节都可以单独设置它的属性，如论文排版，要求彼此之间单独设置页眉、页脚、页码，就必须将文档分为若干节</dd>
      <figure>
        <img src="./imgs/spacer.png" alt="">
        <figcaption>分隔符：分页符和分节符</figcaption>
      </figure>
    </dl>
    <div class="chap">布局</div>
    <dl>
      <dd>内容在页面上的布局方式；默认是顶端对齐</dd>
      <figure>
        <img src="./imgs/page0.png" alt="">
        <figcaption>布局</figcaption>
      </figure>
      <div class="demo">打印水平、垂直居中的姓名牌</div>
      <div class="demo">垂直等分排列页面段落</div>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
