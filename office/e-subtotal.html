<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类汇总 Subtotal</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
  <style>
    figure>div {
      margin: 0 auto;
      height: 96px;
      background-image: url(./imgs/edata.png);
      border-top: 2px solid #217346;
    }

    .img-show {
      width: 264px;
      background-position: -1051px 0px;
    }
  </style>
</head>

<body>
  <header></header>
  <div class="w">
    <h1>分类汇总</h1>
    <h3>Subtotal</h3>
    <dl>
      <figure>
        <div class="img-show"></div>
        <figcaption>分级显示 → 分类汇总</figcaption>
      </figure>
      <dd>先排序后汇总</dd>
      <div class="demo">统计各职称教师的平均工资</div>
      <div>打开 <a
          href="https://view.officeapps.live.com/op/view.aspx?src=https://glplaman.github.io/office/data/教师资料.xlsx">教师资料
          <span class="iconfont icon-filedownload"></span></a></div>
      <div>按照"职称编码"或"职称"排序</div>
      <div>点击"分类汇总"，分类字段选择"职称"；汇总方式选择"平均值"，汇总项选择"工资"，其它保持默认并确定</div>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
