<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录 TOC</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
</head>

<body>
  <header></header>
  <div class="w">
    <h1>目录</h1>
    <h3>Table Of Content</h3>
    <dl>
      <dd>在引言前插入"分页符"，使其新起一页</dd>
      <dd>在关键词后："引用" → "目录" → "自动目录1"</dd>
      <dd>根据需要修改目录样式</dd>
      <dd>如果章节编号从2开始：取消目录所在行的编号，并更新目录，章节编号显示正常</dd>
      <dd>如3级目录样式异常，段前段后有行：修改对应的样式TOC3，将间距调整为0，单倍行距，同其它1级目录样式TOC1、2级目录样式TOC2样式保持一致；更新目录，显示正常</dd>
      <dd>其它：页眉、页脚和其它请自行设计；建议放在最后设计</dd>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
