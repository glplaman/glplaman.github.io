<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视图 View</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
</head>

<body>
  <header></header>
  <div class="w">
    <h1>视图</h1>
    <h3>View</h3>
    <div class="chap">教学实施</div>
    <dl>
      <dt>工作簿视图</dt>
      <dd>普通视图</dd>
      <dd>分页视图：可以调整默|拖动认的分页线的位置，调整页面内容，实现特定的需求
        <p>把数据中按月份分在不同的页</p>
        <p>内容隐藏后，把内容调整到同一页内</p>
      </dd>
      <dt>显示</dt>
      <dd>标题：行的标题123等等、列的标题ABC等等</dd>
      <figure>
        <img src="./imgs/view1.png" alt="">
        <figcaption>显示</figcaption>
      </figure>
      <dt>缩放</dt>
      <dt>窗口</dt>
      <dd>冻结窗格</dd>
      <dd>窗口冻结时，会有相应的线条提示</dd>
      <dd>冻结首行：</dd>
      <dd>冻结多行：选择某个单元格 → 冻结窗格，以当前单元格 <strong>左上角</strong> 为参考，将窗口分为4份，上面的窗口被冻结；通常使用行来定位需要分割的位置</dd>
      <figure>
        <img src="./imgs/view0.png" alt="">
        <figcaption>冻结窗格</figcaption>
      </figure>
      <dt>宏</dt>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
