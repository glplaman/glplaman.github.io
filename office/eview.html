<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视图 View</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
  <style>
    figure>div {
      margin: 0 auto;
      height: 96px;
      background-image: url(./imgs/eview.png);
      border-top: 2px solid #217346;
    }

    .img-sheet {
      width: 215px;
      background-position: 0px -31px;
    }

    .img-show {
      width: 130px;
      background-position: -218px -31px;
    }

    .img-scale {
      width: 152px;
      background-position: -350px -31px;
    }

    .img-window {
      width: 423px;
      background-position: -503px -31px;
    }
  </style>
</head>

<body>
  <header></header>
  <div class="w">
    <h1>视图</h1>
    <h3>View</h3>
    <dl>
      <dt>内容 Contents</dt>
      <dd>工作簿视图</dd>
      <dd>显示</dd>
      <dd>缩放</dd>
      <dd>窗口</dd>
    </dl>
    <div class="chap">工作簿视图</div>
    <dl>
      <dt>普通视图</dt>
      <dt>分页视图</dt>
      <dd>可以调整默|拖动认的分页线的位置，调整页面内容，实现特定的需求
        <p>把数据中按月份分在不同的页</p>
        <p>内容隐藏后，把内容调整到同一页内</p>
      </dd>
      <figure>
        <div class="img-sheet"></div>
        <figcaption>工作簿视图</figcaption>
      </figure>
    </dl>
    <div class="chap">显示</div>
    <dl>
      <dt>网格</dt>
      <dt>标题</dt>
      <dd>行的标题123等等、列的标题ABC等等</dd>
      <figure>
        <div class="img-show"></div>
        <figcaption>显示</figcaption>
      </figure>
    </dl>
    <div class="chap">缩放</div>
    <dl>
      <figure>
        <div class="img-scale"></div>
        <figcaption>缩放</figcaption>
      </figure>
    </dl>
    <dl></dl>
    <div class="chap">窗口</div>
    <dl>
      <dd>始终在窗口上显示表单某部分</dd>
      <dd>窗口冻结时，会有相应的线条提示</dd>
      <figure>
        <div class="img-window"></div>
        <figcaption>窗口</figcaption>
      </figure>
      <dt>冻结窗格</dt>
      <dd>工作表滚动时，保持选择的部分可见</dd>
      <dd>选择某个单元格 → 冻结窗格，以当前单元格 <strong>左上角</strong> 为参考，将窗口分为4份，上面/左侧的窗口被冻结</dd>
      <dt>冻结首行</dt>
      <dd>工作表滚动时，保持首行可见</dd>
      <dt>冻结首列</dt>
      <dd>工作表滚动时，保持首列可见</dd>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
