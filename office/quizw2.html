<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排版</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
  <style>
    a:has(.iconfont) {
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header></header>
  <div class="w">
    <h1>排版</h1>
    <h3>Document</h3>
    <dl>
      <dt>知识点</dt>
      <dd>多级列表
        <p>1级</p>
        <p>2级</p>
        <p>3级</p>
      </dd>
      <dd>标题样式</dd>
      <dd>题注
        <p>图片题注</p>
        <p>表格题注</p>
      </dd>
      <dd>分节</dd>
      <dd>目录</dd>
      <dt>文档准备</dt>
      <dd>新建文档</dd>
      <dd>以学号+姓名+排版，如20260320王大力排版</dd>
      <dt>文档结构</dt>
      <dd>首页</dd>
      <dd>版权说明</dd>
      <dd>中文摘要</dd>
      <dd>英文摘要</dd>
      <div class="tips">前面几项不要页码</div>
      <dd>目录
        <p>最后生成</p>
        <p>页码：大写罗马数字</p>
      </dd>
      <dd>正文
        <p>章节1</p>
        <p>章节2</p>
        <p>章节3</p>
        <p>章节4</p>
        <p>章节5</p>
      </dd>
      <dd>致谢</dd>
      <dd>参考文献</dd>
      <div class="tips">正文开始到参考文献，页码使用阿拉伯数字</div>
      <dd>附录</dd>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
