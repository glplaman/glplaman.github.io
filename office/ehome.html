<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开始 Home</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <base target="_blank">
  <style>
    figure>div {
      margin: 0 auto;
      height: 96px;
      background-image: url(./imgs/ehome.png);
      border-top: 2px solid #217346;
    }

    .img-paste {
      width: 134px;
      background-position: -0px 0px;
    }

    .img-font {
      width: 277px;
      background-position: -135px 0px;
    }

    .img-align {
      width: 262px;
      background-position: -413px 0px;
    }

    .img-num {
      width: 155px;
      background-position: -676px 0px;
    }

    .img-style {
      width: 588px;
      background-position: -832px 0px;
    }

    .img-cell {
      width: 141px;
      background-position: -1421px 0px;
    }

    .img-edit {
      width: 246px;
      background-position: -1563px 0px;
    }
  </style>
</head>

<body>
  <header></header>
  <div class="w">
    <h1>开始</h1>
    <h3>Home</h3>
    <div class="chap">教学实施</div>
    <dl>
      <dt>剪切板</dt>
      <dd>基本操作同 Word</dd>
      <figure>
        <div class="img-paste"></div>
        <figcaption>剪切板</figcaption>
      </figure>
      <dt>字体</dt>
      <dd>基本操作同 Word</dd>
      <figure>
        <div class="img-font"></div>
        <figcaption>字体</figcaption>
      </figure>
      <figure>
        <img src="./imgs/home7.png" alt="">
        <figcaption>字体→更多设置</figcaption>
      </figure>
      <dt>边框</dt>
      <dd>基本操作同 Word</dd>
      <dt>对齐方式</dt>
      <dd>基本操作同 Word</dd>
      <figure>
        <div class="img-align"></div>
        <figcaption>对齐方式</figcaption>
      </figure>
      <figure>
        <img src="./imgs/home8.png" alt="">
        <figcaption>对齐方式</figcaption>
      </figure>
      <dt>数字</dt>
      <dd>数字在不同场合下的不同格式</dd>
      <dd>可以定制数字格式，如隐藏手机号码中间4位137xxxx5481</dd>
      <figure>
        <div class="img-num"></div>
        <figcaption>数字</figcaption>
      </figure>
      <figure>
        <img src="./imgs/cell0.png" alt="">
        <figcaption>数字→单元格格式</figcaption>
      </figure>
      <dt>样式</dt>
      <dd>条件格式；功能非常强大 <span class="iconfont icon-thumbup"></span></dd>
      <figure>
        <div class="img-style"></div>
        <figcaption>样式</figcaption>
      </figure>
      <figure>
        <img src="./imgs/home6.png" alt="">
        <figcaption>条件格式</figcaption>
      </figure>
      <dt>单元格</dt>
      <dd>插入</dd>
      <dd>删除</dd>
      <dd>格式：设置单元格格式，如大小、可见性和保护</dd>
      <dd>点击下方更多 &blacktriangledown;，获取更多操作</dd>
      <figure>
        <div class="img-cell"></div>
        <figcaption>单元格</figcaption>
      </figure>
      <figure>
        <img src="./imgs/ehome-cell.png" alt="">
        <figcaption>单元格格式</figcaption>
      </figure>
      <dt>编辑</dt>
      <dd>多单元格数据的操作</dd>
      <dd>更多操作，请访问"数据"一节</dd>
      <figure>
        <div class="img-edit"></div>
        <figcaption>编辑</figcaption>
      </figure>
      <div class="tips">
        <div>字体、数字、对齐、边框和填充共享一个对话框</div>
        <div>快捷键 Ctrl + 1</div>
      </div>
    </dl>
    <div id="footer"></div>
  </div>
  <script src="/utils/custom/footer.js"></script>
</body>

</html>
